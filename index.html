<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抓寶中醫師｜Google 智慧早報設定精靈</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#172b35;background:#f3f8f8}*{box-sizing:border-box}body{margin:0}header{background:#0d565b;color:white;padding:28px 20px}main{max-width:790px;margin:28px auto;padding:0 16px}.brand{max-width:790px;margin:auto}h1{font-size:clamp(25px,5vw,36px);margin:6px 0}p{line-height:1.7}.sub{opacity:.88}.card{background:white;border:1px solid #dce9e9;border-radius:18px;padding:25px;box-shadow:0 5px 22px #143f4410}h2{margin-top:0;font-size:22px}.step{color:#087a76;font-weight:700;font-size:14px}.options{display:grid;gap:12px;margin:20px 0}label{display:block;border:1px solid #cddfdf;padding:14px;border-radius:12px;cursor:pointer}label:has(input:checked){border-color:#07877e;background:#e9f8f5}input[type=radio],input[type=checkbox]{margin-right:10px}input[type=text],input[type=email],input[type=time],select,textarea{width:100%;padding:12px;border:1px solid #b6cece;border-radius:10px;font:inherit;margin-top:9px}textarea{min-height:130px}button,.linkbtn{background:#087b76;color:white;border:0;border-radius:11px;padding:13px 20px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#e5eeee;color:#204c4c}button:disabled{opacity:.4}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}.note{background:#edf6f6;padding:14px;border-radius:10px;color:#36585b;font-size:14px}.tiny{font-size:13px;color:#62797b}.hide{display:none}.progress{height:7px;background:#dce9e9;border-radius:9px;margin-bottom:20px}.bar{height:100%;background:#0b9b8e;border-radius:9px;transition:width .2s}code{overflow-wrap:anywhere}footer{max-width:790px;margin:28px auto;padding:0 16px 25px;color:#526c70;font-size:13px}</style></head><body><header><div class="brand"><div>抓寶中醫師 · 免費設定精靈</div><h1>Google 智慧早報與日期提醒</h1><p class="sub">用簡單問答建立個人化設定，再帶入 ChatGPT 建立自動任務。</p></div></header><main><div class="progress"><div class="bar" id="bar"></div></div><section class="card"><div class="step" id="step"></div><h2 id="question"></h2><div id="content"></div><div class="actions"><button class="secondary" id="back">上一步</button><button id="next">下一步</button></div></section></main><footer>本頁不要求 Google 密碼，不連接 Google 帳戶，也不會上傳您填寫的資料。僅在本機瀏覽器產生設定文字；實際讀取行事曆、寄信及建立排程須在已授權且支援相關功能的 ChatGPT 環境中執行。公開使用時請避免將含私人信箱的產出公開張貼。</footer><script>
const steps=[['mode','您希望啟用哪些功能？'],['zone','您的時區是？'],['cal','要讀取哪些 Google 行事曆？'],['delivery','希望每天幾點前收到早報？'],['briefEmail','早報寄到哪個信箱？'],['briefDetail','早報要包含哪些內容？'],['remindType','想設定哪種特殊日期提醒？'],['rule','提醒的日期規則是？'],['remindEmail','特殊日期提醒寄給誰？'],['ahead','要當天提醒還是提前通知？'],['done','設定完成，複製指令到 ChatGPT']];let i=0;const state={mode:'both',zone:'Asia/Taipei',cal:'主要行事曆及使用者指定可存取的其他行事曆',delivery:'07:00',briefEmail:'',briefDetail:'全天事件、依時間排序的行程、地點、備註、時間衝突；合併重複生日',remindType:'佛教十齋日',rule:'農曆初一、初八、十四、十五、十八、廿三、廿四及農曆月底最後三天（大月廿八廿九三十；小月廿七廿八廿九），閏月依使用者確認規則處理',remindEmail:'',ahead:'當天上午07:00前'};
const $=id=>document.getElementById(id);const opt=(key,arr)=>'<div class="options">'+arr.map(([v,t])=>`<label><input type="radio" name="${key}" value="${v}" ${state[key]===v?'checked':''}>${t}</label>`).join('')+'</div>';const field=(key,placeholder,type='text')=>`<input id="field" type="${type}" value="${esc(state[key]||'')}" placeholder="${placeholder}">`;function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')};function active(){return steps.filter(([k])=>k==='done'||k==='mode'||k==='zone'||(state.mode!=='reminder'&&['cal','delivery','briefEmail','briefDetail'].includes(k))||(state.mode!=='brief'&&['remindType','rule','remindEmail','ahead'].includes(k)))}function render(){const a=active();i=Math.min(i,a.length-1);const [k,q]=a[i];$('step').textContent=`第 ${i+1} / ${a.length} 步`;$('question').textContent=q;$('bar').style.width=(100*(i+1)/a.length)+'%';$('back').disabled=i===0;$('next').textContent=k==='done'?'重新開始':'下一步';let html='';if(k==='mode')html=opt(k,[['both','每日早報 + 特殊日期提醒'],['brief','只有每日行事曆早報'],['reminder','只有特殊日期提醒']]);if(k==='zone')html=opt(k,[['Asia/Taipei','台灣時間（Asia/Taipei）'],['Asia/Hong_Kong','香港時間'],['Asia/Tokyo','日本時間'],['America/Los_Angeles','美西時間']]);if(k==='cal')html=opt(k,[['主要行事曆及使用者指定可存取的其他行事曆','主要行事曆 + 自選其他日曆'],['僅主要行事曆','只讀取主要行事曆']]);if(k==='delivery')html=`<p>建議至少提早 30 分鐘執行任務。</p>${field(k,'07:00','time')}`;if(k==='briefEmail')html=`<p>僅填自己的收件信箱；也可以留空，改用 ChatGPT 通知。</p>${field(k,'name@gmail.com','email')}`;if(k==='briefDetail')html=field(k,'早報內容');if(k==='remindType')html=opt(k,[['佛教十齋日','佛教十齋日'],['農曆初一十五','農曆初一、十五'],['生日或紀念日','生日或紀念日'],['每月固定日期','每月固定日期'],['自訂規則','自行指定規則']]);if(k==='rule')html=`<p>請明確寫下日期；若是農曆日期，系統將要求核對閏月及小月。</p><textarea id="field">${esc(state.rule)}</textarea>`;if(k==='remindEmail')html=`<p>可輸入多個地址，以逗號分隔。請先取得收件人同意。</p>${field(k,'me@gmail.com, family@gmail.com')}`;if(k==='ahead')html=opt(k,[['當天上午07:00前','當天早上 7:00 前'],['提前一天上午07:00前','提前一天早上 7:00 前'],['提前三天上午07:00前','提前三天早上 7:00 前']]);if(k==='done'){html=`<p>下方是為您產生的 ChatGPT 設定指令。請複製後貼到 ChatGPT，讓它逐步確認 Google Calendar、Gmail 授權及排程支援情況。</p><textarea readonly id="out"></textarea><div class="actions"><button id="copy">複製設定指令</button><button id="download">下載文字檔</button><a class="linkbtn" target="_blank" rel="noopener" href="https://chatgpt.com/">開啟 ChatGPT ↗</a></div><p class="note">重要：網頁不會直接建立 ChatGPT 自訂 GPT，也不會自行寄信。請在 ChatGPT 中確認排程建立結果、手動測試郵件寄出結果，以及首次自動排程結果。自訂 GPT 的公開發布需由建立者於 GPT 編輯器完成。</p>`;} $('content').innerHTML=html;if(k==='done'){$('out').value=promptText();$('copy').onclick=()=>navigator.clipboard.writeText(promptText()).then(()=>alert('已複製'));$('download').onclick=()=>{const b=new Blob([promptText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='我的Google智慧早報設定.txt';a.click();URL.revokeObjectURL(url)}}}function save(){const k=active()[i][0];const selected=document.querySelector(`input[name="${k}"]:checked`);const f=$('field');if(selected)state[k]=selected.value;if(f)state[k]=f.value.trim()}function promptText(){return `請擔任「抓寶中醫師｜Google 智慧早報設定精靈」，使用繁體中文，一次只問我一個尚未確認的必要問題，協助設定以下功能。\n\n需求：${state.mode==='both'?'每日早報與特殊日期提醒':state.mode==='brief'?'每日行事曆早報':'特殊日期提醒'}\n時區：${state.zone}\n${state.mode==='reminder'?'':`行事曆：${state.cal}\n早報目標時間：${state.delivery} 前\n早報收件人：${state.briefEmail||'ChatGPT 通知（不寄郵件）'}\n早報內容：${state.briefDetail}\n`}${state.mode==='brief'?'':`提醒類型：${state.remindType}\n日期規則：${state.rule}\n提醒收件人：${state.remindEmail||'ChatGPT 通知（不寄郵件）'}\n提醒時間：${state.ahead}\n`}\n操作規則：\n1. 先檢查 Google Calendar 與 Gmail 是否已授權；只使用可存取的日曆，不索取密碼或驗證碼。\n2. 寄出測試郵件前先徵求我明確同意，私人行程僅寄到指定信箱。\n3. 若能建立排程，安排在收件目標時間前執行；日期提醒僅在符合條件時通知。\n4. 十齋日等農曆規則須核對當地曆法、大小月與閏月，不確定時先向我確認。\n5. 實際讀取、寄信、排程建立、收件驗證分開報告，未經工具證實不得聲稱成功。\n6. 如果 ChatGPT 排程不支援 Gmail 自動寄信，請明確說明，提供可行替代方案（例如 Google Apps Script）而非假稱已完成。\n7. 設定後請協助測試一封早報及一封日期提醒（如適用），再提示我驗證首次自動執行。`;}$('next').onclick=()=>{if(active()[i][0]==='done'){i=0;render();return}save();i++;render()};$('back').onclick=()=>{save();i--;render()};render();
</script></body></html>
